[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "paga-python"
version = "0.1.0"
description = "Async Python SDK for the Paga Engine API - payments, payouts, wallets and financial operations."
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.9"
keywords = ["paga", "payments", "payouts", "fintech", "open-banking", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[project.urls]
# The SDK documentation is hosted on GitHub; Paga's own API reference is
# linked from the README.
Homepage = "https://github.com/TeamTrustBridge/paga-python"
Documentation = "https://github.com/TeamTrustBridge/paga-python#readme"
Repository = "https://github.com/TeamTrustBridge/paga-python"
Issues = "https://github.com/TeamTrustBridge/paga-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/paga"]

[tool.hatch.build.targets.sdist]
include = ["src/paga", "README.md", "LICENSE", "pyproject.toml"]
